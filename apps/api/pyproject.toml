[project]
name = "lockin-api"
version = "0.0.1"
description = "LockIn API - FastAPI gateway and core services"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "LockIn Team" }]

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",          # async Postgres driver
    "psycopg[binary]>=3.2",   # sync driver for Alembic migrations

    # Cache and event bus
    "redis>=5.2",

    # Agent workflows
    "temporalio>=1.8",

    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "authlib>=1.3",           # OAuth 2.1 client
    "webauthn>=2.5",          # passkey registration + assertion

    # HTTP client (Google Calendar, LLM providers)
    "httpx>=0.28",

    # UUID generation (Rust-backed UUIDv7)
    "uuid-utils==0.10.0",

    # Observability
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "sentry-sdk[fastapi]>=2.18",
    "structlog>=24.4",

    # Shared workspace packages
    "lockin-events",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",            # also for TestClient
    "fakeredis>=2.26",        # in-memory Redis (incl. Streams) for tests

    # Linting and formatting
    "ruff>=0.8",
    "mypy>=1.13",

    # Pre-commit
    "pre-commit>=4.0",
]

ml = [
    # Pulled in only when ML services need them - keeps the API image lean
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "numpy>=2.1",
    "pandas>=2.2",
]

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
[tool.uv]
# Pin the uv version to keep CI deterministic across the team
required-version = ">=0.5.0"

# Compile bytecode at install time for faster cold starts in containers
compile-bytecode = true

# Use a lockfile - uv generates uv.lock automatically
package = true

[tool.uv.sources]
lockin-events = { workspace = true }

# ---------------------------------------------------------------------------
# Build system
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter, replaces black/isort/flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "S",    # bandit (security)
    "ASYNC",# async best practices
]
ignore = [
    "S101", # asserts are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

# ---------------------------------------------------------------------------
# Mypy (type checker - strict for new code)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["temporalio.*", "lightgbm.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
]
