[project]
name = "lockin-mcp"
version = "0.0.1"
description = "LockIn MCP server - exposes LockIn tools to Claude, ChatGPT, Gemini"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "LockIn Team" }]

dependencies = [
    # MCP SDK
    "mcp>=1.0",

    # Config + validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # HTTP client to talk back to apps/api
    "httpx>=0.28",

    # Observability
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "structlog>=24.4",

    # SSE transport (production)
    "uvicorn[standard]>=0.32",
    "starlette>=0.41",

    # Shared workspace packages
    "lockin-events",
]

[tool.uv.sources]
lockin-events = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

# ---------------------------------------------------------------------------
# uv configuration (mirrors apps/api/pyproject.toml)
# ---------------------------------------------------------------------------
[tool.uv]
required-version = ">=0.5.0"
compile-bytecode = true
package = true

# ---------------------------------------------------------------------------
# Build system
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--strict-markers", "--cov=app", "--cov-report=term-missing"]
