# DEPRECATED — superseded by infra/dev/docker-compose.yml (Week 3-4 §1).
# This file runs plain postgres:16-alpine with NO TimescaleDB extension,
# which makes alembic migration 0001+ fail. The canonical dev substrate is
# at infra/dev/docker-compose.yml (timescale/timescaledb:2.17.2-pg16 on :5433).
# Kept for reference only; will be removed once nothing in the repo or scripts
# references it. Do NOT use for new development.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lockin
      POSTGRES_USER: lockin
      POSTGRES_PASSWORD: lockin_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: lockin_events
      POSTGRES_USER: lockin
      POSTGRES_PASSWORD: lockin_dev
    ports:
      - "5433:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  tsdata:
